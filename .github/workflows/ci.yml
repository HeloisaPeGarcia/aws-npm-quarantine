name: CI — npm-quarantine

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # para comentar o plano do Terraform no PR

env:
  TF_VERSION: "1.8.0"
  PYTHON_VERSION: "3.12"
  AWS_REGION: "us-east-1"

jobs:
  # ── Testes unitários da Lambda ──────────────────────────────────────────────
  test:
    name: 🧪 Unit Tests & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=promote_package \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: lambda/coverage.xml
          flags: lambda

  # ── Linting Python ──────────────────────────────────────────────────────────
  lint-python:
    name: 🔍 Python Lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install ruff mypy boto3-stubs[codeartifact,sns,cloudwatch] botocore-stubs

      - name: Run ruff
        run: ruff check promote_package.py

      - name: Run mypy
        run: mypy promote_package.py --ignore-missing-imports --strict

  # ── Validação e scan de segurança do Terraform ─────────────────────────────
  terraform-validate:
    name: ✅ Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init (local backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: terraform fmt check
        run: terraform fmt -check -recursive

  # ── Checkov: IaC Security Scan ─────────────────────────────────────────────
  checkov:
    name: 🛡️ Checkov IaC Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: false
          skip_check: >-
            CKV_AWS_117,
            CKV2_AWS_12

    # CKV_AWS_117: Lambda VPC — skip pois é condicional por design
    # CKV2_AWS_12: Default VPC — não usamos VPC default

  # ── tfsec: Security Scanner específico para Terraform ─────────────────────
  tfsec:
    name: 🔒 tfsec Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/
          soft_fail: false

  # ── Terraform Plan (apenas em PRs, com credenciais AWS) ────────────────────
  terraform-plan:
    name: 📋 Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [terraform-validate, checkov, tfsec]
    environment: dev
    defaults:
      run:
        working-directory: infra

    # Necessário: configurar secrets no repositório GitHub:
    # AWS_ROLE_ARN — ARN da role IAM com permissão de plan/apply (OIDC)
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: terraform init

      - name: terraform plan
        id: plan
        run: |
          terraform plan \
            -var="environment=dev" \
            -no-color \
            -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... (truncated)'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📋 Terraform Plan\n\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
